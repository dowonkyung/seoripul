name: Validate website and photo picker
on:
  push:
    branches: [main]
    paths: ['**.js', '**.cjs', '**.html', '.github/workflows/validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-site.cjs
      - run: node scripts/test-photo-picker.cjs
